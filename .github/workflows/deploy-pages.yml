name: Generar sitio desde PowerPoint y publicar Pages

on:
  push:
    branches: ["main"]
    paths:
      - "presentation/**.pptx"
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "site.yml"
      - "requirements.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar LibreOffice, Poppler y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress \
            poppler-utils \
            fonts-liberation \
            fonts-dejavu-core \
            fonts-noto-core

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Inventariar contenido del PowerPoint
        run: python scripts/inspect_pptx.py --config site.yml

      - name: Generar sitio estático
        run: python scripts/build_site.py --config site.yml --output dist

      - name: Validar sitio generado
        run: python scripts/validate_site.py --site dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
